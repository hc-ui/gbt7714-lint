name: Publish to PyPI

# 依赖 PyPI Trusted Publishing（无需 API Token）：
# 在 pypi.org → Account settings → Publishing 添加 pending publisher：
#   project=gbt7714-lint, owner=hc-ui, repo=gbt7714-lint,
#   workflow=publish.yml, environment=pypi
# 配置好后，发布 GitHub Release（或手动触发本工作流）即自动上传。

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
